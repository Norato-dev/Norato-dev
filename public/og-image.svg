<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Big background number -->
  <text x="920" y="520" font-family="monospace" font-weight="800" font-size="380"
    fill="rgba(127,119,221,0.05)" letter-spacing="-20">5+</text>

  <!-- Top label -->
  <rect x="80" y="80" width="6" height="6" fill="#1d9e75"/>
  <text x="96" y="91" font-family="monospace" font-size="13" fill="#1d9e75" letter-spacing="3">FRONTEND ENGINEER — BOGOTÁ, CO</text>

  <!-- Name -->
  <text x="80" y="230" font-family="Arial Black, sans-serif" font-weight="800" font-size="100"
    fill="#f0eee8" letter-spacing="-4">David</text>
  <text x="80" y="340" font-family="Arial Black, sans-serif" font-weight="800" font-size="100"
    fill="#7f77dd" letter-spacing="-4">Norato</text>
  <text x="80" y="450" font-family="Arial Black, sans-serif" font-weight="800" font-size="100"
    fill="#f0eee8" letter-spacing="-4">Ramírez</text>

  <!-- Stack chips -->
  <rect x="80" y="490" width="90" height="28" rx="0" fill="rgba(127,119,221,0.15)" stroke="rgba(127,119,221,0.3)" stroke-width="1"/>
  <text x="125" y="509" font-family="monospace" font-size="11" fill="#7f77dd" text-anchor="middle" letter-spacing="1">React</text>

  <rect x="182" y="490" width="120" height="28" rx="0" fill="rgba(127,119,221,0.15)" stroke="rgba(127,119,221,0.3)" stroke-width="1"/>
  <text x="242" y="509" font-family="monospace" font-size="11" fill="#7f77dd" text-anchor="middle" letter-spacing="1">TypeScript</text>

  <rect x="314" y="490" width="100" height="28" rx="0" fill="rgba(127,119,221,0.15)" stroke="rgba(127,119,221,0.3)" stroke-width="1"/>
  <text x="364" y="509" font-family="monospace" font-size="11" fill="#7f77dd" text-anchor="middle" letter-spacing="1">Next.js</text>

  <!-- URL bottom right -->
  <text x="1120" y="570" font-family="monospace" font-size="16" fill="rgba(240,238,232,0.3)"
    text-anchor="end" letter-spacing="1">davidnorato.dev</text>

  <!-- Bottom border accent -->
  <rect x="80" y="580" width="200" height="2" fill="#7f77dd"/>
</svg>
